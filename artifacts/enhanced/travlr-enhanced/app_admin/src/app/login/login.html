<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">

      <div class="card shadow">
        <div class="card-body">

          <h2 class="text-center mb-4">
            Admin Login
          </h2>

          <form (ngSubmit)="login()">

            <div class="mb-3">
              <label for="email" class="form-label">
                Email
              </label>

              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                [(ngModel)]="email"
                required
              >
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">
                Password
              </label>

              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                [(ngModel)]="password"
                required
              >
            </div>

            <div
              *ngIf="errorMessage"
              class="alert alert-danger"
            >
              {{ errorMessage }}
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100"
            >
              Login
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
