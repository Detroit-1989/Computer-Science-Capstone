<p>Trip Edit</p>

<form>

    <label>Name</label><br>
    <input 
        type = "text" 
        [(ngModel)] = "trip.name"
        name = "name"> <br><br>

    <label>Length</label><br>
    <input 
        type = "text" 
        [(ngModel)] = "trip.length"
        name = "length"> <br><br>

    <label>Resort</label><br>
    <input 
        type = "text" 
        [(ngModel)] = "trip.resort"
        name = "resort"> <br><br>

    <label>Price</label><br>
    <input 
        type = "text" 
        [(ngModel)] = "trip.perPerson"
        name = "perPerson"> <br><br>

    <label>Description</label><br>
    <textarea 
        rows = "5"
        [(ngModel)] = "trip.description"
        name = "description"> 
    </textarea>

    <br><br>

    <button 
        type = "button"
        (click) = "saveTrip()">
        Save Changes
    </button>    

</form>
