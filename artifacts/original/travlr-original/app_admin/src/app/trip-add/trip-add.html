<h2>Add Trip</h2>

<label>Code</label><br>
<input
  type="text"
  [(ngModel)]="trip.code"
  name="code">
<br><br>

<label>Name</label><br>
<input
  type="text"
  [(ngModel)]="trip.name"
  name="name">
<br><br>

<label>Length</label><br>
<input
  type="text"
  [(ngModel)]="trip.length"
  name="length">
<br><br>

<label>Start Date</label><br>
<input
  type="date"
  [(ngModel)]="trip.start"
  name="start">
<br><br>

<label>Resort</label><br>
<input
  type="text"
  [(ngModel)]="trip.resort"
  name="resort">
<br><br>

<label>Price Per Person</label><br>
<input
  type="text"
  [(ngModel)]="trip.perPerson"
  name="perPerson">
<br><br>

<label>Image Filename</label><br>
<input
  type="text"
  [(ngModel)]="trip.image"
  name="image">
<br><br>

<label>Description</label><br>
<textarea
  rows="5"
  [(ngModel)]="trip.description"
  name="description">
</textarea>

<br><br>

<button
  type="button"
  (click)="addTrip()">
  Add Trip
</button>
